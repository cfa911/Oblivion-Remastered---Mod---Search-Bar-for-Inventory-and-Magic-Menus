; Menu Search - Controller Keyboard - a controller on-screen keyboard for the search of the Menu Search plugin (which it needs).
; Read once when the game starts. Delete a line to get its default.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error. The log is OBSE\Logs\MenuSearchControllerKeyboard.log. 3 = warnings and errors only; set 2 or 1 to send a log with a bug report.
uLogLevel=3

[SearchKeyboard]
; Hold the button in the Inventory or Magic menu to open the keyboard; a quick tap stays the game's own (it steps the sort). While it is
; open the menu stands still: D-pad / left stick move, A types, X deletes (hold to clear everything), Y is a space, B or Start closes it
; (the search stays). It works in the menus that have the search on in MenuSearch.ini.
bEnabled=1
; XInput button mask: 8 = D-pad right (the default), 4 = D-pad left, 1 = D-pad up, 2 = D-pad down, 256 = LB, 512 = RB, 64 = L3 (0 = off)
uButton=8
; In the container / barter menu the keyboard has two sides: this button (above) types into your side's search, and this one into the other side's
; (the container's or the merchant's) - same hold, same mask. Default 4 = D-pad left. 0 = off.
uButtonLeft=4
uHoldMs=400
; Where it sits, as a percent of the screen.
uLeftPercent=49
uTopPercent=14
uRightPercent=93
uBottomPercent=87
; The keys' text size.
uTextPercent=100
