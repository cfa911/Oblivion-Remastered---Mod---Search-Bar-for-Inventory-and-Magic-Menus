; SearchLight - Controller Keyboard: on-screen keyboard for SearchLight (requires 1.2.0 or newer).
; The filename remains MenuSearchControllerKeyboard.ini for compatibility.
; Read at game startup. Close the game before editing, then restart. Missing keys use built-in defaults.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error. The log is OBSE\Logs\MenuSearchControllerKeyboard.log. 3 = warnings and errors only; set 2 or 1 to send a log with a bug report.
uLogLevel=3

[SearchKeyboard]
; Hold the opening button in Inventory, Magic or Quests; containers/barter use the two buttons below.
; A quick tap keeps the game's normal action (such as sorting). While open, D-pad / left stick navigate keys,
; A types, X deletes (hold to clear), Y inserts a space, B or Start closes it. The search stays active.
; LT / RT still switch tabs; normal list navigation is held while typing.
; Only menus enabled in MenuSearch.ini are supported. In a plain container, either opening button works.
bEnabled=1
; XInput button mask: 8 = D-pad right (the default), 4 = D-pad left, 1 = D-pad up, 2 = D-pad down, 256 = LB, 512 = RB, 64 = L3 (0 = off)
uButton=8
; In the container / barter menu the keyboard has two sides: this button (above) types into your side's search, and this one into the other side's
; (the container's or the merchant's) - same hold, same mask. Default 4 = D-pad left. 0 = off.
uButtonLeft=4
; Hold time in milliseconds (150 to 2000). 400 ms = 0.4 seconds.
uHoldMs=400
; Panel edges as screen percentages, not width/height: left/top start, right/bottom end.
; Left/top: 0 to 90. Right/bottom: at least 10 points beyond the start, up to 100.
; In containers/barter the keyboard is placed opposite the searched list.
uLeftPercent=49
uTopPercent=14
uRightPercent=93
uBottomPercent=87
; Key text scale in percent (30 to 300; 100 = normal).
uTextPercent=100
