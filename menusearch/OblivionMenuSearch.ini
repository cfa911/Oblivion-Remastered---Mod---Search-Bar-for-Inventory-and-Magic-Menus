; Oblivion Menu Search - a search bar, typing for it and a list filter for the Inventory and Magic menus.
; Read once when the game starts. Delete a line to get its default.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error. The log is OBSE\Logs\OblivionMenuSearch.log.
uLogLevel=2

[Search]
; Which menus have the search. 1 = on, 0 = off. (The Search Keyboard plugin works in the menus that are on.)
bInventory=1
bMagic=1

[Bar]
; Type with Ctrl+F or Ctrl+K (or click the bar); Enter or Esc ends typing; Backspace deletes; Ctrl+V pastes.
; The text size.
uFontSize=19
; Where the bar sits in the menu's root canvas and how big it is, in the menu's own units (about 1.33 screen pixels at 1440p; fractions
; are fine). uX / uY are the top-left corner.
uX=289
uY=111
uWidth=486
uHeight=36
; Added to uY in that menu only (negative = up): the two menus sit a hair apart.
uYInventory=-1.5
uYMagic=-0.75

[Filter]
; Filters the lists by a case-insensitive part of the item's name, and filters again at once when the game rebuilds the list after a press
; (no flash of the unfiltered list). 1 = on.
bEnabled=1
