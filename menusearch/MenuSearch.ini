; SearchLight - search bars and filtering for Inventory, Magic, Quests, containers and barter.
; The filename remains MenuSearch.ini for compatibility.
; Read at game startup. Close the game before editing, then restart.
; Missing keys use built-in defaults or legacy [Bar] fallbacks. Deleting position keys may change the shipped layout;
; restore the supplied ini values to recover that exact layout.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error. The log is OBSE\Logs\MenuSearch.log. 3 = warnings and errors only; set 2 or 1 to send a log with a bug report.
uLogLevel=3

[Search]
; Which menus have the search. 1 = on, 0 = off. (The Controller Keyboard plugin works in the menus that are on.)
bInventory=1
bMagic=1
; The container and barter menu: a bar above each side (yours, and the container's or the merchant's).
bContainer=1
; The quests tab (the journal): a bar above the quest list.
bQuests=1
; Typing accepts any character your keyboard layout makes (accents, umlauts, Cyrillic, Greek, CJK ...). Case is always ignored.
; 1 = plain letters also find accented ones (typing a also finds a with an umlaut); a letter you type WITH an accent always finds only that letter.
; 0 = a plain letter finds only itself.
bIgnoreAccents=1
; Japanese and Chinese input methods (IME) type into the bars. 1 = on, 0 = off (the game then handles the IME as it always did).
bIme=1

[Bar]
; Ctrl+F (or click a bar) starts typing; Enter or Esc stops; Backspace deletes; Ctrl+V pastes; Ctrl+A selects all.
; After selecting all, typing replaces the text; Backspace or Delete clears it.
; In containers/barter, Ctrl+F targets the side under the mouse. Clear the text to show the full list.
; Text size of every bar (8 to 60; default 19).
uFontSize=19

; Where each bar sits and how big it is, in the menu's own units (about 1.33 screen pixels at 1440p; fractions are fine).
; Inventory and Magic: uX / uY are the bar's top-left corner in the menu's root canvas.
[Inventory]
uX=293
uY=109.5
uWidth=482
uHeight=36

[Magic]
uX=294
uY=110.25
uWidth=481
uHeight=36

; The container and barter menu has a bar on each side: yours (left) and the container's or the merchant's (right). They are placed from the
; spot above the side's header, moved by uXOffset / uYOffset (negative = left / up). Width 0 = as wide as the header. Their pictures are
; MenuSearch\SearchBarYours.png (green) and SearchBarTheirs.png (red); a missing one falls back to SearchBar.png.
[ContainerYours]
uXOffset=-48
uYOffset=-90
uWidth=825
uHeight=37

[ContainerTheirs]
uXOffset=-48
uYOffset=-90
uWidth=823
uHeight=37

; A plain container (nothing to give, only its list on the screen): the container's bar is placed from its header the same way. Width 0 = as
; wide as the header plus the offset on both sides.
[ContainerTake]
uXOffset=-48
uYOffset=-11
uWidth=0
uHeight=37

; The quests tab: its bar sits where the Magic menu's does (the same corner and size, in the menu's own units) unless you change it here.
[Quest]
uX=294
uY=110.25
uWidth=481
uHeight=36

[Filter]
; Filters the lists by a case-insensitive part of the item's name, and filters again at once when the game rebuilds the list after a press
; (no flash of the unfiltered list). 1 = on.
bEnabled=1
