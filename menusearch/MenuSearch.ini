; Menu Search - a search bar, typing for it and a list filter for the Inventory, Magic and container / barter menus.
; Read once when the game starts. Delete a line to get its default.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error. The log is OBSE\Logs\MenuSearch.log. 3 = warnings and errors only; set 2 or 1 to send a log with a bug report.
uLogLevel=3

[Search]
; Which menus have the search. 1 = on, 0 = off. (The Controller Keyboard plugin works in the menus that are on.)
bInventory=1
bMagic=1
; The container and barter menu: a bar above each side (yours, and the container's or the merchant's).
bContainer=1
; The quests tab (the journal): a bar above the quest list.
bQuests=1

[Bar]
; Type with Ctrl+F (or click the bar); Enter or Esc ends typing; Backspace deletes; Ctrl+V pastes.
; The text size of every bar.
uFontSize=19

; Where each bar sits and how big it is, in the menu's own units (about 1.33 screen pixels at 1440p; fractions are fine).
; Inventory and Magic: uX / uY are the bar's top-left corner in the menu's root canvas.
[Inventory]
uX=293
uY=109.5
uWidth=482
uHeight=36

[Magic]
uX=294
uY=110.25
uWidth=481
uHeight=36

; The container and barter menu has a bar on each side: yours (left) and the container's or the merchant's (right). They are placed from the
; spot above the side's header, moved by uXOffset / uYOffset (negative = left / up). Width 0 = as wide as the header. Their pictures are
; MenuSearch\SearchBarYours.png (green) and SearchBarTheirs.png (red); a missing one falls back to SearchBar.png.
[ContainerYours]
uXOffset=-48
uYOffset=-90
uWidth=825
uHeight=37

[ContainerTheirs]
uXOffset=-48
uYOffset=-90
uWidth=823
uHeight=37

; A plain container (nothing to give, only its list on the screen): the container's bar is placed from its header the same way. Width 0 = as
; wide as the header plus the offset on both sides.
[ContainerTake]
uXOffset=-48
uYOffset=-11
uWidth=0
uHeight=37

; The quests tab: its bar sits where the Magic menu's does (the same corner and size, in the menu's own units) unless you change it here.
[Quest]
uX=294
uY=110.25
uWidth=481
uHeight=36

[Filter]
; Filters the lists by a case-insensitive part of the item's name, and filters again at once when the game rebuilds the list after a press
; (no flash of the unfiltered list). 1 = on.
bEnabled=1
